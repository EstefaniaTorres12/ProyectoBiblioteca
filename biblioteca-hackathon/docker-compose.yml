services:
  mysql:
    image: mysql:8.4
    container_name: biblioteca-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biblioteca_db}
      MYSQL_USER: ${MYSQL_USER:-biblioteca_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-biblioteca_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-biblioteca/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-biblioteca
    container_name: biblioteca-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://biblioteca_user:biblioteca_pass@mysql:3306/biblioteca_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: ${API_PORT:-3000}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy || true && npm run dev"
    volumes:
      - ./backend-biblioteca:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend-biblioteca
    container_name: biblioteca-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend-biblioteca:/app
      - /app/node_modules

volumes:
  mysql_data:
